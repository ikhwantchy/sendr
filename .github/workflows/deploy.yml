name: Deploy to Staging

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Navigate to project dir (Support both folder names)
            cd ~/Sendr || cd ~/brobot || echo "Project folder not found!" && exit 1
            
            echo "Deployment started..."
            
            # Pull latest code (includes pre-built .next/ from local)
            git pull origin main
            
            # Backend Setup
            cd backend
            npm install --no-audit --no-fund
            npm run build
            npm run migrate
            
            # Frontend: install deps only (NO build — built locally to avoid OOM)
            cd ../frontend
            npm install --no-audit --no-fund
            
            # Restart Services
            pm2 restart all
            
            echo "Deployment finished successfully!"
